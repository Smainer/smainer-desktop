name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build provider sidecar
        shell: pwsh
        env:
          MONOREPO_TOKEN: ${{ secrets.MONOREPO_TOKEN }}
        run: |
          # Clone without checkout to avoid Windows-illegal filenames (#, etc.)
          git clone --depth 1 --no-checkout --single-branch `
            "https://x-access-token:$env:MONOREPO_TOKEN@github.com/Smainer/smainer-backend.git" `
            _backend

          # Enable sparse checkout — only pull provider/src/provider/
          git -C _backend sparse-checkout init --cone
          git -C _backend sparse-checkout set provider/src/provider
          git -C _backend checkout

          # Verify
          $mainPy = "_backend\provider\src\provider\main.py"
          if (-not (Test-Path $mainPy)) {
            Write-Error "Provider main.py not found at $mainPy"
            Get-ChildItem _backend -Recurse -Name | Select-Object -First 40
            exit 1
          }
          Write-Host "Found: $mainPy"

          # Install dependencies + PyInstaller
          pip install pyinstaller websockets psutil starknet-py aiohttp

          # Build standalone exe
          pyinstaller `
            --onefile `
            --name smainer-provider `
            --distpath dist-provider `
            --hidden-import=provider `
            --hidden-import=provider.main `
            --hidden-import=websockets `
            --hidden-import=psutil `
            $mainPy

          # Place in Tauri sidecar location with target triple
          New-Item -ItemType Directory -Force -Path src-tauri\binaries
          Copy-Item dist-provider\smainer-provider.exe `
            src-tauri\binaries\smainer-provider-x86_64-pc-windows-msvc.exe

          $size = (Get-Item src-tauri\binaries\smainer-provider-x86_64-pc-windows-msvc.exe).Length
          Write-Host "Sidecar built: $size bytes"

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.release.windows.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Smainer ${{ github.ref_name }}
          releaseBody: |
            ## Download

            **[⬇ Smainer-setup.exe](https://github.com/Smainer/smainer-desktop/releases/latest/download/Smainer_0.1.0_x64-setup.exe)**

            Double-click → Next → Install → Done. No command line, no admin needed.

            Includes the provider daemon — just click **Start Node** after install.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

  # Regression guard: test that local dev works without sidecar
  test-local-dev:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Test local build without sidecar
        run: npm run tauri build -- --bundles msi
        
      - name: Verify MSI was created
        run: |
          if (Test-Path "src-tauri/target/release/bundle/msi/*.msi") {
            Write-Host "✓ MSI bundle created successfully without sidecar"
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          } else {
            Write-Host "✗ MSI bundle failed to create"
            exit 1
          }
