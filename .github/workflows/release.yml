name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build provider sidecar
        shell: pwsh
        run: |
          # Clone only the provider source from smainer monorepo
          git clone --depth 1 --filter=blob:none --sparse `
            https://github.com/Smainer/smainer.git _monorepo
          cd _monorepo
          git sparse-checkout set backend/provider
          cd ..

          # Install provider dependencies + PyInstaller
          pip install pyinstaller websockets psutil starknet-py aiohttp

          # Build standalone exe
          pyinstaller `
            --onefile `
            --name smainer-provider `
            --distpath dist-provider `
            --hidden-import=provider `
            --hidden-import=provider.main `
            --hidden-import=websockets `
            --hidden-import=psutil `
            _monorepo/backend/provider/src/provider/main.py

          # Place in Tauri sidecar location with target triple
          New-Item -ItemType Directory -Force -Path src-tauri\binaries
          Copy-Item dist-provider\smainer-provider.exe `
            src-tauri\binaries\smainer-provider-x86_64-pc-windows-msvc.exe

          Write-Host "Sidecar built: $(Get-Item src-tauri\binaries\smainer-provider-x86_64-pc-windows-msvc.exe | Select-Object -ExpandProperty Length) bytes"

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Smainer ${{ github.ref_name }}
          releaseBody: |
            ## Download

            **[⬇ Smainer-setup.exe](https://github.com/Smainer/smainer-desktop/releases/latest/download/Smainer_0.1.0_x64-setup.exe)**

            Double-click → Next → Install → Done. No command line, no admin needed.

            Includes the provider daemon — just click **Start Node** after install.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
