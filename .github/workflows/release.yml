name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Smainer ${{ github.ref_name }}
          releaseBody: |
            ## Download

            | File | Description |
            |------|-------------|
            | `Smainer_*_x64-setup.exe` | **Windows installer — click to install** |
            | `Smainer_*_x64_en-US.msi` | Windows MSI (enterprise/IT) |

            ### What's included
            - One-click installer (no admin required)
            - Automatic node registration
            - Real-time dashboard

            **Just download → double-click → done.**
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
