name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BACKEND_PROVIDER_REF: main

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINDOWS_SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_B64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build provider sidecar
        shell: pwsh
        env:
          MONOREPO_TOKEN: ${{ secrets.MONOREPO_TOKEN }}
        run: |
          # Clone entire provider package including spec file
          git clone --depth 1 --no-checkout --single-branch --branch "$env:BACKEND_PROVIDER_REF" `
            "https://x-access-token:$env:MONOREPO_TOKEN@github.com/Smainer/smainer-backend.git" `
            _backend

          # Record exact backend source SHA for build provenance
          $backendSha = (git -C _backend rev-parse HEAD).Trim()
          Write-Host "Backend provider source ref: $env:BACKEND_PROVIDER_REF"
          Write-Host "Backend provider source SHA: $backendSha"
          "BACKEND_PROVIDER_SHA=$backendSha" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Enable sparse checkout — pull provider/ with spec file
          git -C _backend sparse-checkout init --cone
          git -C _backend sparse-checkout set provider
          git -C _backend checkout

          # Verify spec file and entry point exist
          $specFile = "_backend\provider\smainer-provider.spec"
          $entryPoint = "_backend\provider\run_provider.py"
          
          if (-not (Test-Path $specFile)) {
            Write-Error "Spec file not found at $specFile"
            Get-ChildItem _backend\provider -Recurse -Name | Select-Object -First 40
            exit 1
          }
          if (-not (Test-Path $entryPoint)) {
            Write-Error "Provider entry point not found at $entryPoint"
            exit 1
          }

          if (-not (Test-Path "_backend\provider")) {
            Write-Error "Expected provider path missing at _backend\\provider"
            exit 1
          }

          # Guardrail: fail release if secure hook/runtime wiring is missing
          $specContent = Get-Content $specFile -Raw
          if ($specContent -notmatch "hookspath\s*=\s*\[\s*'hooks'\s*\]") {
            Write-Error "Secure hook path not enabled in smainer-provider.spec"
            exit 1
          }
          if ($specContent -notmatch "runtime_hooks\s*=\s*\[\s*'runtime_hooks/runtime_crypto_fix_secure\.py'\s*\]") {
            Write-Error "Secure runtime hook not enabled in smainer-provider.spec"
            exit 1
          }
          if ($specContent -match "runtime_crypto_fix\.py") {
            Write-Error "Legacy insecure runtime hook reference detected in smainer-provider.spec"
            exit 1
          }

          $entryContent = Get-Content $entryPoint -Raw
          if ($entryContent -notmatch "from provider\.main import main") {
            Write-Error "run_provider.py is missing provider.main bootstrap import"
            exit 1
          }
          if ($entryContent -match "from main import main") {
            Write-Error "Legacy relative bootstrap import detected in run_provider.py"
            exit 1
          }

          Write-Host "Found spec: $specFile"
          Write-Host "Found entry point: $entryPoint"

          # Install provider dependencies from pyproject.toml
          cd _backend\provider
          pip install -e ".[build]"

          # Build using spec file (all hidden imports and config defined there)
          pyinstaller smainer-provider.spec --distpath dist

          # Place in Tauri sidecar location with required target-triple suffix
          # tauri.conf.json declares externalBin as "binaries/smainer-provider";
          # Tauri resolves the actual file by appending the target triple at build time.
          New-Item -ItemType Directory -Force -Path ..\..\src-tauri\binaries
          Copy-Item dist\smainer-provider.exe `
            ..\..\src-tauri\binaries\smainer-provider-x86_64-pc-windows-msvc.exe

          $size = (Get-Item ..\..\src-tauri\binaries\smainer-provider-x86_64-pc-windows-msvc.exe).Length
          Write-Host "Sidecar built: $size bytes"

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.release.windows.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Smainer ${{ github.ref_name }}
          releaseBody: |
            ## Download

            **[⬇ Smainer-setup.exe](https://github.com/Smainer/smainer-desktop/releases/latest/download/Smainer_0.1.0_x64-setup.exe)**

            Double-click → Next → Install → Done. No command line, no admin needed.

            Includes the provider daemon — just click **Start Node** after install.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Sign Windows artifacts
        if: ${{ env.WINDOWS_SIGN_CERT_B64 != '' && env.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          # Resolve signtool path once (wildcard won't work as executable)
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" `
            | Sort-Object FullName -Descending `
            | Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Error "signtool.exe not found in Windows SDK"
            exit 1
          }
          Write-Host "Using signtool: $signtool"

          # Decode PFX certificate
          $certBytes = [Convert]::FromBase64String($env:CERT_B64)
          $certPath = "signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Locate unsigned artifacts
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1

          if (-not $nsis -or -not $msi) {
            Write-Error "NSIS exe or MSI not found"
            exit 1
          }

          Write-Host "Signing: $($nsis.FullName)"
          Write-Host "Signing: $($msi.FullName)"

          # Sign with SHA256 + RFC3161 timestamping (primary)
          & $signtool sign `
            /f $certPath `
            /p $env:CERT_PASSWORD `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /v `
            $nsis.FullName

          & $signtool sign `
            /f $certPath `
            /p $env:CERT_PASSWORD `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /v `
            $msi.FullName

          # Fallback timestamp if primary failed
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Primary timestamp failed, trying fallback..."
            & $signtool sign `
              /f $certPath `
              /p $env:CERT_PASSWORD `
              /fd SHA256 `
              /tr http://timestamp.sectigo.com `
              /td SHA256 `
              /v `
              $nsis.FullName $msi.FullName
          }

          # Verify signatures
          & $signtool verify /pa /v $nsis.FullName
          & $signtool verify /pa /v $msi.FullName

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Signature verification failed"
            exit 1
          }

          # Export paths for upload step
          "SIGNED_NSIS=$($nsis.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNED_MSI=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Cleanup
          Remove-Item $certPath

      - name: Upload signed artifacts
        if: ${{ env.WINDOWS_SIGN_CERT_B64 != '' && env.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace unsigned artifacts with signed versions
          gh release upload ${{ github.ref_name }} `
            $env:SIGNED_NSIS `
            $env:SIGNED_MSI `
            --clobber `
            --repo Smainer/smainer-desktop

          Write-Host "✓ Signed artifacts uploaded to release ${{ github.ref_name }}"

      - name: Warn about unsigned artifacts
        if: ${{ env.WINDOWS_SIGN_CERT_B64 == '' || env.WINDOWS_SIGN_CERT_PASSWORD == '' }}
        shell: pwsh
        run: |
          Write-Warning "════════════════════════════════════════════════════════════════"
          Write-Warning "  UNSIGNED ARTIFACTS: SmartScreen warnings will appear for users"
          Write-Warning "════════════════════════════════════════════════════════════════"
          Write-Warning ""
          Write-Warning "Missing secrets:"
          if ([string]::IsNullOrEmpty("${{ secrets.WINDOWS_SIGN_CERT_B64 }}")) {
            Write-Warning "  - WINDOWS_SIGN_CERT_B64"
          }
          if ([string]::IsNullOrEmpty("${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}")) {
            Write-Warning "  - WINDOWS_SIGN_CERT_PASSWORD"
          }
          Write-Warning ""
          Write-Warning "Add these secrets in repository settings to enable code signing."
          Write-Warning "════════════════════════════════════════════════════════════════"

  # Regression guard: test that local dev works without sidecar
  test-local-dev:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Create stub sidecar for CI (no provider built in this job)
        shell: pwsh
        run: |
          # Tauri requires the target-suffixed sidecar file to exist at bundle time.
          # This job only tests that the MSI build pipeline works; the stub is
          # never shipped — it is replaced by the real binary in build-windows.
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Set-Content -Path "src-tauri/binaries/smainer-provider-x86_64-pc-windows-msvc.exe" `
            -Value "STUB" -Encoding Ascii
          Write-Host "Stub sidecar created for local-dev CI test"

      - name: Test local build without sidecar
        run: npm run tauri build -- --bundles msi
        
      - name: Verify MSI was created
        run: |
          if (Test-Path "src-tauri/target/release/bundle/msi/*.msi") {
            Write-Host "✓ MSI bundle created successfully without sidecar"
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          } else {
            Write-Host "✗ MSI bundle failed to create"
            exit 1
          }
