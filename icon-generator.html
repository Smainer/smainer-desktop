<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smainer Icon Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .canvas-container { display: none; }
        .icon-preview { margin: 10px; display: inline-block; border: 1px solid #ccc; }
        .download-section { margin-top: 20px; }
        button { padding: 10px 15px; margin: 5px; }
        .generated { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎨 Smainer Desktop Icon Generator</h1>
    <p>This tool converts the Smainer canonical SVG logo to all required Tauri app icon formats.</p>
    
    <div id="svg-container"></div>
    
    <div class="download-section">
        <button onclick="generateAllIcons()">Generate All Icons</button>
        <div id="status"></div>
    </div>
    
    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    
    <div id="icons-preview"></div>

    <script>
        // Smainer canonical SVG logo
        const svgContent = `<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Smainer Canonical Logo - Distributed Compute Blocks -->
  <!-- Background container - rounded for modern feel -->
  <rect width="512" height="512" rx="96" fill="#09090B"/>
  
  <!-- Distributed compute blocks arranged in S formation -->
  <!-- Top row -->
  <rect x="200" y="104" width="112" height="48" rx="8" fill="#FFFFFF"/>
  <rect x="328" y="104" width="48" height="48" rx="8" fill="#3B82F6"/>
  
  <!-- Second row -->
  <rect x="136" y="168" width="48" height="48" rx="8" fill="#FFFFFF"/>
  
  <!-- Third row -->
  <rect x="200" y="232" width="112" height="48" rx="8" fill="#FFFFFF"/>
  
  <!-- Fourth row -->
  <rect x="328" y="296" width="48" height="48" rx="8" fill="#FFFFFF"/>
  
  <!-- Bottom row -->
  <rect x="136" y="360" width="48" height="48" rx="8" fill="#3B82F6"/>
  <rect x="200" y="360" width="112" height="48" rx="8" fill="#FFFFFF"/>
</svg>`;

        // Icon sizes needed for Tauri
        const iconSizes = [
            { name: '32x32.png', size: 32 },
            { name: '128x128.png', size: 128 },
            { name: '128x128@2x.png', size: 256 },
            { name: 'icon.png', size: 512 },
            
            // Windows Store assets
            { name: 'Square30x30Logo.png', size: 30 },
            { name: 'Square44x44Logo.png', size: 44 },
            { name: 'Square71x71Logo.png', size: 71 },
            { name: 'Square89x89Logo.png', size: 89 },
            { name: 'Square107x107Logo.png', size: 107 },
            { name: 'Square142x142Logo.png', size: 142 },
            { name: 'Square150x150Logo.png', size: 150 },
            { name: 'Square284x284Logo.png', size: 284 },
            { name: 'Square310x310Logo.png', size: 310 },
            { name: 'StoreLogo.png', size: 50 }
        ];

        // Display the SVG
        document.getElementById('svg-container').innerHTML = svgContent;

        function generateIcon(size, filename) {
            return new Promise((resolve) => {
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = size;
                canvas.height = size;
                
                const img = new Image();
                const svgBlob = new Blob([svgContent], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                
                img.onload = function() {
                    ctx.clearRect(0, 0, size, size);
                    ctx.drawImage(img, 0, 0, size, size);
                    
                    canvas.toBlob((blob) => {
                        const link = document.createElement('a');
                        link.download = filename;
                        link.href = URL.createObjectURL(blob);
                        
                        // Create preview
                        const preview = document.createElement('div');
                        preview.className = 'icon-preview';
                        preview.innerHTML = `
                            <div>${filename} (${size}x${size})</div>
                            <canvas width="${Math.min(size, 64)}" height="${Math.min(size, 64)}"></canvas>
                            <div><a href="${link.href}" download="${filename}">Download</a></div>
                        `;
                        
                        const previewCanvas = preview.querySelector('canvas');
                        const previewCtx = previewCanvas.getContext('2d');
                        const previewSize = Math.min(size, 64);
                        previewCtx.drawImage(img, 0, 0, previewSize, previewSize);
                        
                        document.getElementById('icons-preview').appendChild(preview);
                        
                        URL.revokeObjectURL(url);
                        resolve({ filename, blob, link });
                    }, 'image/png');
                };
                
                img.src = url;
            });
        }

        async function generateAllIcons() {
            const status = document.getElementById('status');
            status.innerHTML = 'Generating icons...';
            
            document.getElementById('icons-preview').innerHTML = '';
            
            for (const icon of iconSizes) {
                await generateIcon(icon.size, icon.name);
                status.innerHTML = `Generated ${icon.name}...`;
                await new Promise(resolve => setTimeout(resolve, 100)); // Small delay for UI
            }
            
            status.innerHTML = '<div class="generated">✅ All icons generated! Download them individually above.</div>';
            
            // Generate instructions
            const instructions = document.createElement('div');
            instructions.innerHTML = `
                <h3>📋 Installation Instructions:</h3>
                <ol>
                    <li>Download all PNG files above</li>
                    <li>Copy them to <code>src-tauri/icons/</code> directory</li>
                    <li>Run <code>npm run build</code></li>
                    <li>Test with <code>npm run tauri build</code></li>
                </ol>
            `;
            document.getElementById('icons-preview').appendChild(instructions);
        }
    </script>
</body>
</html>
